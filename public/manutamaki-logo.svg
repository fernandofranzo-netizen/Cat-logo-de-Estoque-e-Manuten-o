<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 94" width="380" height="94">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect 
    x="1.5" 
    y="1.5" 
    width="377" 
    height="91" 
    rx="14" 
    ry="14" 
    fill="#ffffff" 
    stroke="#e2e8f0" 
    stroke-width="1.5"
    filter="url(#soft-shadow)"
  />

  <!-- Left: Brand Name "Manutamaki" -->
  <text 
    x="28" 
    y="56" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="33" 
    font-weight="900" 
    letter-spacing="-0.5px"
  >
    <tspan fill="#002d7a">Manuta</tspan><tspan fill="#1e72db">maki</tspan>
  </text>

  <!-- Vertical Divider Line -->
  <line 
    x1="216" 
    y1="22" 
    x2="216" 
    y2="72" 
    stroke="#d8e2ec" 
    stroke-width="1.5" 
    stroke-linecap="round"
  />

  <!-- Right: Technical Unit Description -->
  <!-- Line 1: UNIDADE INDUSTRIAL -->
  <text 
    x="234" 
    y="35" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="10.5" 
    font-weight="600" 
    fill="#64748b" 
    letter-spacing="1.8px"
  >
    UNIDADE INDUSTRIAL
  </text>

  <!-- Line 2: ALMOXARIFADO -->
  <text 
    x="234" 
    y="53" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="13.5" 
    font-weight="800" 
    fill="#002d7a" 
    letter-spacing="0.6px"
  >
    ALMOXARIFADO
  </text>

  <!-- Line 3: MANUTENÇÃO -->
  <text 
    x="234" 
    y="71" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="13.5" 
    font-weight="800" 
    fill="#002d7a" 
    letter-spacing="0.6px"
  >
    MANUTENÇÃO
  </text>
</svg>
