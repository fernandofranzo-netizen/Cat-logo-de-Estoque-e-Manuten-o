<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 84" width="350" height="84">
  <defs>
    <filter id="badge-shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Clean Rounded Card Box -->
  <rect 
    x="1.5" 
    y="1.5" 
    width="347" 
    height="81" 
    rx="12" 
    fill="#ffffff" 
    stroke="#e2e8f0" 
    stroke-width="1.5"
    filter="url(#badge-shadow)"
  />

  <!-- Left: "Manutamaki" Brand -->
  <text 
    x="22" 
    y="51" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="-0.5px"
  >
    <tspan fill="#003399">Manuta</tspan><tspan fill="#1d72dd">maki</tspan>
  </text>

  <!-- Vertical Divider Line -->
  <line 
    x1="184" 
    y1="18" 
    x2="184" 
    y2="66" 
    stroke="#e2e8f0" 
    stroke-width="1.5" 
  />

  <!-- Right: 3 Lines Right-Aligned -->
  <!-- Line 1: UNIDADE INDUSTRIAL -->
  <text 
    x="328" 
    y="31" 
    text-anchor="end"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="9.5" 
    font-weight="600" 
    fill="#64748b" 
    letter-spacing="1.5px"
  >UNIDADE INDUSTRIAL</text>

  <!-- Line 2: ALMOXARIFADO -->
  <text 
    x="328" 
    y="48" 
    text-anchor="end"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="12.5" 
    font-weight="800" 
    fill="#003399" 
    letter-spacing="0.5px"
  >ALMOXARIFADO</text>

  <!-- Line 3: MANUTENÇÃO -->
  <text 
    x="328" 
    y="65" 
    text-anchor="end"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="12.5" 
    font-weight="800" 
    fill="#003399" 
    letter-spacing="0.5px"
  >MANUTENÇÃO</text>
</svg>
